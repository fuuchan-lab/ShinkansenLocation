<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Feature graphic</title>
<!-- Google Play のフィーチャーグラフィック（1024×500）。ブラウザで開いて 1024×500 で撮る -->
<style>
  html, body { margin: 0; }
  body {
    width: 1024px; height: 500px; overflow: hidden; display: flex; align-items: center; gap: 48px; padding: 0 64px; box-sizing: border-box;
    background: radial-gradient(circle at 78% 30%, #1d4f9a 0%, #0b1f3a 70%); color: #fff;
    font-family: "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
  }
  img { width: 300px; height: 300px; flex: none; filter: drop-shadow(0 12px 30px rgba(0, 0, 0, .45)); }
  h1 { margin: 0 0 18px; font-size: 64px; letter-spacing: .02em; line-height: 1.1; }
  p { margin: 0; font-size: 28px; line-height: 1.6; color: #d7e6ff; }
  .tags { margin-top: 22px; display: flex; gap: 12px; }
  .tags span { font-size: 22px; padding: 6px 16px; border-radius: 999px; background: rgba(255, 255, 255, .14); }
</style>
</head>
<body>
  <img src="icon-512.png" alt="">
  <div>
    <h1>のりものレーダー</h1>
    <p>新幹線・飛行機・船が、<br>いまどこを走っているかを地図で。</p>
    <div class="tags"><span>🚄 新幹線</span><span>✈ 飛行機</span><span>⛴ 船</span><span>☂ 雨雲</span></div>
  </div>
</body>
</html>
